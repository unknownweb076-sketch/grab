<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grab</title>
<style>
:root{--bg:#0b0d14;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--a:#4f8cff;--b:#a05aff;--ok:#4be39a;--err:#ff6b7a;--mut:#9aa0b4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:#eef0f6;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden;padding:18px 16px 40px}
.blob{position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;animation:float 14s ease-in-out infinite alternate}
.b1{background:var(--a);top:-80px;left:-100px}
.b2{background:var(--b);bottom:-100px;right:-100px;animation-delay:-7s}
@keyframes float{to{transform:translate(60px,80px) scale(1.2)}}
.wrap{max-width:560px;margin:auto}
header{display:flex;align-items:center;gap:12px;margin:10px 0 20px;animation:rise .6s both}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-size:22px;box-shadow:0 8px 24px rgba(120,100,255,.4)}
h1{font-size:24px;margin:0;letter-spacing:-.5px}
header p{margin:2px 0 0;color:var(--mut);font-size:13px;transition:color .3s}
.panel{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;padding:14px;animation:rise .6s .1s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.field{position:relative}
textarea{width:100%;height:92px;resize:none;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:#fff;padding:12px 84px 12px 14px;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(79,140,255,.18)}
textarea.bad{animation:shake .4s;border-color:var(--err)}
.paste{position:absolute;right:10px;top:10px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;transition:transform .15s}
.paste:active{transform:scale(.9)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:rgba(0,0,0,.25);border-radius:14px;padding:4px;margin:12px 0}
.seg button{position:relative;z-index:1;border:0;background:none;color:var(--mut);padding:10px;font-size:14px;font-weight:600;transition:color .25s}
.seg button.on{color:#fff}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:11px;background:linear-gradient(135deg,var(--a),var(--b));transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.seg[data-m=audio] .pill{transform:translateX(100%)}
.go{width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 10px 28px rgba(110,100,255,.4);transition:transform .15s;position:relative;overflow:hidden}
.go:active{transform:scale(.97)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.auto{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--mut)}
.sw{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.15);position:relative;transition:background .25s;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--ok)}
.sw.on::after{transform:translateX(18px)}
h3{margin:26px 4px 10px;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.9px;text-transform:uppercase}
.job{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px;animation:pop .45s cubic-bezier(.3,1.3,.5,1) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:12px}
.ico{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:18px}
.meta{min-width:0;flex:1}
.t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:12px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc{font-size:13px;font-weight:700;color:var(--mut)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .5s ease;position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:shim 1.2s infinite}
@keyframes shim{to{transform:translateX(100%)}}
.job[data-s=done] .bar i{background:var(--ok)}
.job[data-s=done] .bar i::after,.job[data-s=error] .bar i::after{display:none}
.job[data-s=done] .pc{color:var(--ok)}
.job[data-s=error] .bar i{background:var(--err);width:100%!important}
.job[data-s=error]{animation:pop .45s both,shake .4s .45s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.2);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.job[data-s=done] .ico{background:rgba(75,227,154,.15);color:var(--ok);animation:tick .5s cubic-bezier(.3,1.6,.5,1)}
.job[data-s=error] .ico{background:rgba(255,107,122,.15);color:var(--err)}
@keyframes tick{from{transform:scale(.4)}to{transform:scale(1)}}
.acc{display:flex;gap:10px;animation:rise .6s .15s both}
.chip{flex:1;border:1px solid var(--line);background:var(--card);color:#eef0f6;border-radius:14px;padding:12px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,border-color .25s}
.chip:active{transform:scale(.96)}
.chip i{width:8px;height:8px;border-radius:50%;background:#555;transition:background .3s,box-shadow .3s}
.chip.on{border-color:rgba(75,227,154,.5)}
.chip.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.hint{font-size:12px;color:#6b7188;margin:8px 4px 0}
.empty{text-align:center;color:#6b7188;font-size:14px;padding:30px 0;animation:rise .6s .2s both}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap">
<header><div class="logo">&#11015;&#65039;</div><div><h1>Grab</h1><p id="sub">Getting ready...</p></div></header>
<div class="panel">
  <div class="field"><textarea id="u" placeholder="Paste video links here..." autocomplete="off" spellcheck="false"></textarea>
  <button class="paste" id="paste">Paste</button></div>
  <div class="seg" id="seg" data-m="video"><div class="pill"></div>
    <button class="on" data-m="video">&#127916; Video</button><button data-m="audio">&#127925; Audio</button></div>
  <button class="go" id="go">Download</button>
  <div class="auto"><span>Auto-download on paste</span><button class="sw" id="sw"></button></div>
</div>
<h3>Accounts</h3>
<div class="acc">
  <button class="chip" id="acc-youtube"><i></i>YouTube</button>
  <button class="chip" id="acc-instagram"><i></i>Instagram</button>
</div>
<div class="hint">Sign in once to fix "Please sign in" errors. Hold a chip to sign out.</div>
<h3>Downloads</h3>
<div id="list"></div>
<div class="empty" id="empty">Nothing yet &#10024;<br>Paste a link above to start</div>
</div>
<script>
const $=id=>document.getElementById(id);
let mode='video',auto=true;
try{auto=localStorage.getItem('auto')!=='0'}catch(e){}
const seg=$('seg'),sw=$('sw');
function setMode(m){mode=m;seg.dataset.m=m;seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===m))}
seg.querySelectorAll('button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
sw.classList.toggle('on',auto);
sw.onclick=()=>{auto=!auto;sw.classList.toggle('on',auto);try{localStorage.setItem('auto',auto?'1':'0')}catch(e){}};
function ripple(e){const b=e.currentTarget,r=document.createElement('span'),d=Math.max(b.clientWidth,b.clientHeight),rc=b.getBoundingClientRect();
  r.className='rip';r.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-rc.left-d/2)+'px;top:'+(e.clientY-rc.top-d/2)+'px';
  b.appendChild(r);setTimeout(()=>r.remove(),600)}

function go(){
  const ta=$('u'),t=ta.value.trim();if(!t)return;
  const urls=t.split(/\s+/).filter(x=>/^https?:\/\//i.test(x));
  if(!urls.length){ta.classList.add('bad');setTimeout(()=>ta.classList.remove('bad'),400);return}
  ta.value='';
  urls.forEach(u=>{
    const id=Android.download(u,mode);
    onJob({id:id,url:u,state:'running',pct:0,msg:'Starting...'});
  });
}
$('go').addEventListener('click',e=>{ripple(e);go()});
$('u').addEventListener('paste',()=>{if(auto)setTimeout(go,80)});
$('paste').onclick=()=>{
  let t='';try{t=Android.paste()}catch(e){}
  if(t){$('u').value=t;if(auto)go()}else{$('u').focus()}
};
window.incoming=function(t){$('u').value=t;go()};

const els={},jobs={};
function onJob(j){
  const st=jobs[j.id]||(jobs[j.id]={url:'',title:'',state:'running',pct:0,msg:''});
  for(const k in j){if(j[k]!==undefined&&j[k]!==null&&j[k]!=='')st[k]=j[k]}
  let el=els[j.id];
  if(!el){
    el=document.createElement('div');el.className='job';
    el.innerHTML='<div class="top"><div class="ico"></div><div class="meta"><div class="t"></div><div class="s"></div></div><div class="pc"></div></div><div class="bar"><i></i></div>';
    $('list').prepend(el);els[j.id]=el;
    $('empty').style.display='none';
  }
  el.querySelector('.t').textContent=st.title||st.url;
  el.querySelector('.s').textContent=st.msg;
  el.querySelector('.bar i').style.width=(st.state==='done'?100:st.pct)+'%';
  el.querySelector('.pc').textContent=st.state==='done'?'100%':(st.state==='error'?'':Math.round(st.pct)+'%');
  if(el.dataset.s!==st.state){
    el.dataset.s=st.state;
    el.querySelector('.ico').innerHTML=st.state==='done'?'&#10003;':(st.state==='error'?'&#10005;':'<div class="spin"></div>');
  }
}
window.onJob=onJob;

function refreshLogin(){
  ['youtube','instagram'].forEach(s=>{
    let on=false;try{on=Android.hasLogin(s)}catch(e){}
    $('acc-'+s).classList.toggle('on',on);
  });
}
['youtube','instagram'].forEach(s=>{
  const b=$('acc-'+s);let timer=null,long=false;
  b.addEventListener('touchstart',()=>{long=false;timer=setTimeout(()=>{long=true;try{Android.logout(s)}catch(e){}refreshLogin()},700)},{passive:true});
  b.addEventListener('touchend',()=>clearTimeout(timer));
  b.addEventListener('touchmove',()=>clearTimeout(timer),{passive:true});
  b.addEventListener('click',()=>{if(long){long=false;return}try{Android.login(s)}catch(e){}});
});
window.refreshLogin=refreshLogin;refreshLogin();

const iv=setInterval(()=>{
  try{if(Android.isReady()){$('sub').textContent="Paste a link. That's it.";clearInterval(iv)}}catch(e){}
},400);
</script></body></html>
